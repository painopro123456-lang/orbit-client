name: ORBIT Windows Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Orbit/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        run: dotnet publish Orbit/Orbit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload ORBIT executable
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Windows-x64
          path: publish/ORBIT.exe
          if-no-files-found: error
      - name: Publish direct EXE download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ORBIT - Latest Windows Build
          body: |
            Latest standalone ORBIT launcher for Windows x64.
            Download ORBIT.exe directly. No ZIP extraction required.
          files: publish/ORBIT.exe
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
